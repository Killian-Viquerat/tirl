services:
  # Service to instrument.
  tirl:
    build: .
    ports:
      # Exposes port 8080, forwarding it to container port 8443
      - '8080:8080'
    networks:
      - otel-net

  autoinstrumenter:
    image: otel/ebpf-instrument:main
    pid: 'host'
    privileged: true
    environment:
      OTEL_EBPF_TRACE_PRINTER: text
      OTEL_EBPF_OPEN_PORT: 8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317   # envoyé à Tempo
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      - tempo
    networks:
      - otel-net

  # Profiling CPU/mémoire
  otel-ebpf-profiler:
    image: otel/opentelemetry-collector-ebpf-profiler:0.147.0
    command:
      - --config=/etc/ebpf-profiler-config.yaml
      - --feature-gates=service.profilesSupport
    privileged: true
    pid: "host"
    volumes:
      - ./config/ebpf-profiler-config.yaml:/etc/ebpf-profiler-config.yaml:z
      - /sys/kernel:/sys/kernel:ro
      - /proc:/proc:ro
      - /lib/modules:/lib/modules:ro
    depends_on:
      - pyroscope
    networks:
      - otel-net

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:z
    ports:
      - "4317:4317"   # OTLP gRPC
      - "3200:3200"   # API Tempo
    networks:
      - otel-net

  # Backend profils
  pyroscope:
    image: grafana/pyroscope:1.18.1
    command:
      - -self-profiling.disable-push=true
      - -config.file=/etc/pyroscope.yaml
    volumes:
      - ./config/pyroscope.yaml:/etc/pyroscope.yaml:z
    ports:
      - "4040:4040"
    networks:
      - otel-net

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_INSTALL_PLUGINS=grafana-pyroscope-app
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:z
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - pyroscope
    networks:
      - otel-net

networks:
  otel-net:
    driver: bridge